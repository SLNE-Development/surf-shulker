name: Publish

on:
  push:
    branches:
      - version/*
  workflow_dispatch:

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/version/')
    uses: SLNE-Development/surf-workflows/.github/workflows/build-publish-release-gradle.yml@master
    with:
      modules: "surf-shulker-paper-*-all.jar;surf-shulker-velocity-*-all.jar;surf-shulker-minestom-*-all.jar;surf-shulker-microservice-*-all.jar"
    secrets: inherit
